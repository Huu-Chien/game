<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Zombie Math Apocalypse</title>
    <style>
        :root { --cell-size: 55px; --grid-size: 10; }
        body { background-color: #1a1a1a; color: #00ff00; display: flex; flex-direction: column; align-items: center; font-family: 'Courier New', Courier, monospace; }
        
        #status-bar {
            background: #333; padding: 15px; border-radius: 10px; width: 550px;
            display: flex; justify-content: space-between; margin-bottom: 10px;
            border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }

        #game-board {
            display: grid; grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: 2px; background-color: #444; border: 5px solid #222;
        }

        .cell {
            width: var(--cell-size); height: var(--cell-size);
            background-color: #2c3e50; display: flex; justify-content: center; align-items: center; font-size: 30px;
        }

        /* Icons nhân vật và thực thể */
        .player::after { content: "🕵️‍♂️"; }
        .zombie::after { content: "🧟"; }
        .supply::after { content: "📦"; }
        .blood { background-color: #7f0000 !important; } /* Hiệu ứng khi tiêu diệt */

        /* Quiz Modal */
        #quiz-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content { background: #222; border: 2px solid #00ff00; padding: 30px; border-radius: 15px; text-align: center; color: #00ff00; width: 400px; }
        .opt-btn { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #333; color: #00ff00; border: 1px solid #00ff00; cursor: pointer; }
        .opt-btn:hover { background: #00ff00; color: #000; }
    </style>
</head>
<body>

    <h1 style="color: #ff0000; text-shadow: 2px 2px #000;">☣️ DIỆT ZOMBIE TOÁN HỌC ☣️</h1>

    <div id="status-bar">
        <div>HP: <span id="hp">100</span></div>
        <div>SÁT THƯƠNG SÚNG: <span id="dmg">10</span></div>
        <div>ZOMBIE CÒN: <span id="z-count">5</span></div>
    </div>

    <div id="game-board"></div>
    <p>Di chuyển đè lên 📦 để nâng cấp súng. Khi Sát thương > 50, hãy đi săn 🧟!</p>

    <div id="quiz-modal">
        <div class="modal-content">
            <h2 style="color: #ffcc00;">🛠️ NÂNG CẤP VŨ KHÍ</h2>
            <h3 id="q-text">Câu hỏi?</h3>
            <div id="options"></div>
        </div>
    </div>

    <script>
        const gridSize = 10;
        let player = { x: 0, y: 0, hp: 100, dmg: 10 };
        let zombies = [
            {x: 8, y: 8}, {x: 2, y: 7}, {x: 7, y: 2}, {x: 5, y: 5}, {x: 9, y: 4}
        ];
        let supplies = [];
        const questions = [
            { q: "125 x 4 = ?", a: ["450", "500", "550", "600"], c: 1 },
            { q: "960 : 3 = ?", a: ["320", "300", "330", "310"], c: 0 },
            { q: "150 x 3 + 50 = ?", a: ["450", "550", "500", "400"], c: 2 },
            { q: "720 : 8 - 10 = ?", a: ["70", "85", "90", "80"], c: 3 },
            { q: "222 x 4 = ?", a: ["884", "888", "848", "868"], c: 1 }
        ];

        function init() {
            // Tạo tiếp tế ngẫu nhiên
            for(let i=0; i<8; i++) {
                supplies.push({x: Math.floor(Math.random()*9)+1, y: Math.floor(Math.random()*9)+1});
            }
            render();
            setInterval(moveZombies, 1000); // Zombie di chuyển mỗi giây
        }

        function render() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            for(let y=0; y<gridSize; y++) {
                for(let x=0; x<gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if(x === player.x && y === player.y) cell.classList.add('player');
                    else if(zombies.some(z => z.x === x && z.y === y)) cell.classList.add('zombie');
                    else if(supplies.some(s => s.x === x && s.y === y)) cell.classList.add('supply');
                    board.appendChild(cell);
                }
            }
            updateUI();
        }

        window.addEventListener('keydown', (e) => {
            if(document.getElementById('quiz-modal').style.display === 'flex') return;
            if(e.key === 'ArrowUp' && player.y > 0) player.y--;
            if(e.key === 'ArrowDown' && player.y < 9) player.y++;
            if(e.key === 'ArrowLeft' && player.x > 0) player.x--;
            if(e.key === 'ArrowRight' && player.x < 9) player.x++;
            checkCollisions();
            render();
        });

        function checkCollisions() {
            // Kiểm tra hòm tiếp tế
            let sIdx = supplies.findIndex(s => s.x === player.x && s.y === player.y);
            if(sIdx !== -1) {
                supplies.splice(sIdx, 1);
                showQuiz();
            }

            // Kiểm tra Zombie
            let zIdx = zombies.findIndex(z => z.x === player.x && z.y === player.y);
            if(zIdx !== -1) {
                if(player.dmg >= 50) {
                    alert("PẰNG! Bạn đã tiêu diệt 1 Zombie 🔫");
                    zombies.splice(zIdx, 1);
                } else {
                    alert("CẢNH BÁO! Súng quá yếu, bạn bị Zombie cắn! -30 HP");
                    player.hp -= 30;
                }
            }
        }

        function moveZombies() {
            if(document.getElementById('quiz-modal').style.display === 'flex') return;
            zombies.forEach(z => {
                const dir = Math.floor(Math.random() * 4);
                if(dir === 0 && z.y > 0) z.y--;
                else if(dir === 1 && z.y < 9) z.y++;
                else if(dir === 2 && z.x > 0) z.x--;
                else if(dir === 3 && z.x < 9) z.x++;
            });
            render();
        }

        function showQuiz() {
            const modal = document.getElementById('quiz-modal');
            const q = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('q-text').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = ans;
                btn.onclick = () => {
                    if(i === q.c) {
                        player.dmg += 20;
                        alert("Nâng cấp thành công! Sát thương +20");
                    } else {
                        player.hp -= 10;
                        alert("Thất bại! Súng bị kẹt và bạn mất 10 HP");
                    }
                    modal.style.display = 'none';
                    render();
                };
                optDiv.appendChild(btn);
            });
            modal.style.display = 'flex';
        }

        function updateUI() {
            document.getElementById('hp').innerText = player.hp;
            document.getElementById('dmg').innerText = player.dmg;
            document.getElementById('z-count').innerText = zombies.length;
            if(player.hp <= 0) { alert("BẠN ĐÃ BỊ BIẾN THÀNH ZOMBIE! GAME OVER."); location.reload(); }
            if(zombies.length === 0) { alert("CHÚC MỪNG! BẠN ĐÃ DỌN SẠCH THÀNH PHỐ!"); location.reload(); }
        }

        init();
    </script>
</body>
</html>
