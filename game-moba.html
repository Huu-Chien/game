<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thợ Đào Mỏ Toán Lớp 5 - Chiến Boss 👹</title>
    <style>
        :root {
            --cell-size: 55px; /* Kích thước mỗi ô vuông */
            --grid-size: 10;   /* Bản đồ 10x10 */
        }

        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* Thanh trạng thái phía trên */
        #status-bar {
            background: #34495e;
            padding: 15px;
            border-radius: 10px;
            width: 550px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 18px;
        }

        /* Khung bản đồ */
        #game-board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: 2px;
            background-color: #7f8c8d;
            border: 8px solid #34495e;
            border-radius: 5px;
        }

        /* Các loại ô trên bản đồ */
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #8e44ad; /* Màu đất chưa đào */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: all 0.2s;
        }

        .cell.dug { background-color: #ecf0f1; } /* Đất đã đào */
        .cell.player { background-color: #3498db; position: relative; z-index: 2; }
        .cell.player::after { content: "🕵️"; } /* Icon nhân vật */
        .cell.chest::after { content: "🎁"; }   /* Icon rương */
        .cell.boss { background-color: #c0392b !important; }
        .cell.boss::after { content: "👹"; }    /* Icon Boss */

        /* Cửa sổ câu hỏi (Modal) */
        #quiz-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; /* Ẩn khi không có rương */
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            color: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.2s;
        }

        .option-btn:hover { background: #2980b9; }

        .instruction {
            margin-top: 15px;
            color: #bdc3c7;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>DIỆT BOSS TOÁN HỌC 4 👹</h1>

    <div id="status-bar">
        <div>❤️ HP: <span id="hp">100</span></div>
        <div>⚔️ Kiếm: <span id="power">10</span></div>
        <div>❌ Sai: <span id="wrong">0</span>/5</div>
    </div>

    <div id="game-board"></div>

    <div class="instruction">Dùng 4 phím mũi tên để di chuyển. Kiếm ≥ 70 mới thắng được Boss!</div>

    <div id="quiz-modal">
        <div class="modal-content">
            <h2 style="color: #e67e22;">💎 CÂU HỎI MAY MẮN</h2>
            <h3 id="question-text">Đang tải câu hỏi...</h3>
            <div id="options-container"></div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH DỮ LIỆU ---
        const gridSize = 10;
        let player = { x: 0, y: 0, hp: 100, power: 10, wrong: 0 };
        const bossPos = { x: 9, y: 9 }; // Vị trí Boss ở cuối map
        
        // Kho câu hỏi toán tính toán cơ bản (Phạm vi 3 chữ số)
        const questions = [
            { q: "Tính: 123 x 3 = ?", a: ["363", "369", "396", "339"], c: 1 },
            { q: "Tính: 450 : 5 = ?", a: ["80", "95", "90", "70"], c: 2 },
            { q: "Tính: 215 + 342 = ?", a: ["557", "567", "547", "555"], c: 0 },
            { q: "Tính: 890 - 456 = ?", a: ["444", "434", "436", "446"], c: 1 },
            { q: "Tính: 112 x 4 = ?", a: ["448", "484", "444", "428"], c: 0 },
            { q: "Tính: 630 : 9 = ?", a: ["60", "80", "70", "50"], c: 2 },
            { q: "Tính: 150 x 2 + 50 = ?", a: ["300", "350", "400", "250"], c: 1 },
            { q: "Tính: 999 - 111 - 222 = ?", a: ["666", "555", "777", "444"], c: 0 },
            { q: "Tính: 120 x 5 = ?", a: ["500", "650", "600", "700"], c: 2 },
            { q: "Tính: 848 : 4 = ?", a: ["212", "222", "202", "214"], c: 0 },
            { q: "Tính: 250 x 3 = ?", a: ["700", "750", "800", "650"], c: 1 },
            { q: "Tính: 1000 - 350 = ?", a: ["750", "650", "550", "600"], c: 1 }
        ];

        let mapData = []; // Lưu trữ trạng thái từng ô

        // --- HÀM KHỞI TẠO ---
        function initGame() {
            for (let y = 0; y < gridSize; y++) {
                mapData[y] = [];
                for (let x = 0; x < gridSize; x++) {
                    // Ngẫu nhiên đặt rương (15%), tránh ô đầu và ô cuối
                    let isSpecial = (x === 0 && y === 0) || (x === bossPos.x && y === bossPos.y);
                    mapData[y][x] = (!isSpecial && Math.random() < 0.15) ? 'chest' : 'earth';
                }
            }
            renderMap();
        }

        // --- HÀM VẼ GIAO DIỆN ---
        function renderMap() {
            const board = document.getElementById('game-board');
            board.innerHTML = ''; // Xóa bàn cờ cũ

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    // Xác định class cho ô dựa trên dữ liệu
                    if (x === player.x && y === player.y) cell.classList.add('player');
                    else if (x === bossPos.x && y === bossPos.y) cell.classList.add('boss');
                    else if (mapData[y][x] === 'chest') cell.classList.add('chest');
                    else if (mapData[y][x] === 'dug') cell.classList.add('dug');

                    board.appendChild(cell);
                }
            }
            updateUI();
        }

        // --- HÀM DI CHUYỂN ---
        window.addEventListener('keydown', (e) => {
            // Ngăn di chuyển khi đang trả lời câu hỏi
            if (document.getElementById('quiz-modal').style.display === 'flex') return;

            let oldX = player.x, oldY = player.y;

            if (e.key === 'ArrowUp' && player.y > 0) player.y--;
            if (e.key === 'ArrowDown' && player.y < gridSize - 1) player.y++;
            if (e.key === 'ArrowLeft' && player.x > 0) player.x--;
            if (e.key === 'ArrowRight' && player.x < gridSize - 1) player.x++;

            // Đánh dấu ô vừa đi qua là đã đào
            mapData[oldY][oldX] = 'dug';

            checkCell(); // Kiểm tra ô mới đến có gì
            renderMap();
        });

        // --- HÀM KIỂM TRA Ô ---
        function checkCell() {
            let currentTile = mapData[player.y][player.x];

            // 1. Nếu gặp rương
            if (currentTile === 'chest') {
                mapData[player.y][player.x] = 'dug'; // Rương biến mất ngay
                setTimeout(showQuiz, 100); // Hiện câu hỏi
            }

            // 2. Nếu gặp Boss
            if (player.x === bossPos.x && player.y === bossPos.y) {
                if (player.power >= 70) {
                    alert("⚔️ KIẾM CỦA BẠN ĐỦ MẠNH! Bạn đã tiêu diệt Boss 👹. CHIẾN THẮNG!");
                    location.reload();
                } else {
                    alert("💀 KIẾM QUÁ YẾU! Boss đã đánh bại bạn. GAME OVER!");
                    player.hp = 0;
                    updateUI();
                }
            }
        }

        // --- HÀM HIỂN THỊ CÂU HỎI ---
        function showQuiz() {
            const modal = document.getElementById('quiz-modal');
            const qData = questions[Math.floor(Math.random() * questions.length)];
            
            document.getElementById('question-text').innerText = qData.q;
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';

            qData.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => {
                    if (index === qData.c) {
                        player.power += 20; // Trả lời đúng tăng sức mạnh
                        alert("Chính xác! Sức mạnh kiếm tăng +20 ⚔️");
                    } else {
                        player.hp -= 20; // Trả lời sai trừ máu
                        player.wrong++;
                        alert(`Sai rồi! Đáp án đúng là: ${qData.a[qData.c]} ❌`);
                    }
                    modal.style.display = 'none';
                    updateUI();
                };
                optionsDiv.appendChild(btn);
            });

            modal.style.display = 'flex';
        }

        // --- HÀM CẬP NHẬT CHỈ SỐ ---
        function updateUI() {
            document.getElementById('hp').innerText = player.hp;
            document.getElementById('power').innerText = player.power;
            document.getElementById('wrong').innerText = player.wrong;

            // Kiểm tra điều kiện thua
            if (player.hp <= 0 || player.wrong >= 5) {
                alert("BẠN ĐÃ THẤT BẠI! Hãy thử lại lần sau.");
                location.reload();
            }
        }

        // Chạy game
        initGame();
    </script>
</body>
</html>
